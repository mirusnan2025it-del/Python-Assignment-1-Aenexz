<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Party RSVP</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      font-family: 'Poppins', sans-serif;
    }
    .rsvp-container {
      max-width: 500px;
      margin: 80px auto;
      background-color: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    h2 {
      text-align: center;
      color: #ff6f61;
      font-weight: bold;
    }
    .btn-submit {
      background-color: #ff6f61;
      border: none;
    }
    .btn-submit:hover {
      background-color: #ff856e;
    }
  </style>
</head>
<body>

  <div class="rsvp-container">
    <h2>🎈 RSVP to the Birthday Party 🎈</h2>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Full Name:</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address:</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Will you attend?</label>
        <select class="form-select" required>
          <option value="">Select an option</option>
          <option value="yes">Yes, I’ll be there!</option>
          <option value="no">Sorry, can’t make it</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label"> Message (optional):</label>
        <textarea class="form-control" id="message" rows="3" placeholder="Write a short message..."></textarea>
      </div>

      <button type="submit" class="btn btn-submit w-100 text-white">Send RSVP</button>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
